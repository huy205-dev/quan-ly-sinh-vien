# =============================================================================
#  nginx/qlsv.conf: reverse proxy cho mini project "Quản lý sinh viên"
# -----------------------------------------------------------------------------
#  Trình duyệt ──► Nginx (container, cổng 80; máy host mở cổng 8080)
#              ──► ứng dụng Node.js (chạy trên máy host bằng `npm start`, cổng 3000)
#
#  Cách chạy (xem docker-compose.yml ở thư mục gốc dự án):
#      npm start                 # app: http://localhost:3000
#      docker compose up -d      # Nginx: http://localhost:8080
#
#  File này được mount vào container thành /etc/nginx/conf.d/default.conf.
#  Trong /etc/nginx/nginx.conf của image nginx chính thức có dòng
#      include /etc/nginx/conf.d/*.conf;
#  nằm BÊN TRONG khối  http { ... }. Nghĩa là mọi chỉ thị trong file này đều
#  thuộc ngữ cảnh (context) "http". Điều này quan trọng vì:
#    - log_format CHỈ được phép khai báo trong context http (đặt trong server
#      hay location sẽ bị lỗi "directive is not allowed here");
#    - upstream cũng chỉ hợp lệ trong context http.
#  => Khai báo log_format và upstream ở đầu file này là hợp lệ.
#
#  Kiểm tra cú pháp :  docker compose exec nginx nginx -t
#  Xem cấu hình đầy đủ (sau khi include):  docker compose exec nginx nginx -T
#  Nạp lại cấu hình không cần dừng:  docker compose exec nginx nginx -s reload
# =============================================================================


# -----------------------------------------------------------------------------
# 1) Định dạng log "qlsv" = combined + 3 trường bổ sung
# -----------------------------------------------------------------------------
# Định dạng "combined" có sẵn trong Nginx (không cần và không được khai báo lại):
#   '$remote_addr - $remote_user [$time_local] "$request" '
#   '$status $body_bytes_sent "$http_referer" "$http_user_agent"'
#
# Ta giữ nguyên các trường đó và thêm vào cuối dòng:
#   "$upstream_http_x_user"     tên đăng nhập do app trả về trong header X-User.
#                               Quy tắc tên biến: $upstream_http_ + tên header viết
#                               thường, dấu '-' đổi thành '_'  (X-User -> x_user).
#                               Không có header (khách chưa đăng nhập, file tĩnh,
#                               đăng nhập sai, Nginx tự trả lời) -> ghi "-".
#   rt=$request_time            tổng thời gian xử lý request, tính bằng giây
#                               (độ chính xác mili giây), từ lúc đọc byte đầu tiên
#                               của client đến lúc gửi xong byte cuối cùng.
#   urt=$upstream_response_time thời gian chờ app Node.js trả lời. Là "-" khi
#                               request không được chuyển vào app (ví dụ 413 do
#                               body quá lớn, 400 do request hỏng).
#
# Vì sao không dùng $remote_user để biết "ai truy cập"? Biến này chỉ có giá trị
# khi dùng HTTP Basic Auth. App này xác thực bằng JWT (header
# "Authorization: Bearer <token>") nên $remote_user luôn là "-".
#
# Ví dụ một dòng log thật (lấy từ nginx/sample-logs/access.log):
#   192.168.1.15 - - [06/Nov/2026:14:02:05 +0700] "POST /api/students/bulk-copy HTTP/1.1" 201 407 "http://qlsv.example.com:8080/" "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36 Edg/153.0.0.0" "giaovu" rt=0.004 urt=0.004
#
# Ghi chú: mặc định (escape=default) Nginx thay ký tự '"', '\' và ký tự điều
# khiển trong giá trị biến bằng \xHH, nên dấu " bên trong User-Agent không làm
# vỡ cấu trúc dòng log -> có thể tách trường an toàn bằng awk -F'"'.
log_format qlsv '$remote_addr - $remote_user [$time_local] "$request" '
                '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                '"$upstream_http_x_user" rt=$request_time urt=$upstream_response_time';


# -----------------------------------------------------------------------------
# 2) Upstream: ứng dụng Node.js chạy trên máy host
# -----------------------------------------------------------------------------
# host.docker.internal = địa chỉ của máy host nhìn từ bên trong container.
#   - Docker Desktop (macOS, Windows): có sẵn.
#   - Linux: cần "extra_hosts: host.docker.internal:host-gateway" (đã khai báo
#     trong docker-compose.yml).
# Nginx phân giải tên này một lần khi khởi động / reload. Nếu app chưa chạy,
# Nginx vẫn khởi động bình thường, chỉ là request sẽ nhận 502.
upstream qlsv_app {
    server host.docker.internal:3000;
}


# -----------------------------------------------------------------------------
# 3) Virtual server lắng nghe cổng 80 trong container
# -----------------------------------------------------------------------------
server {
    listen      80 default_server;
    server_name _;

    # Không lộ số phiên bản Nginx trong header "Server" và trang lỗi mặc định.
    server_tokens off;

    # Kích thước body tối đa của một request. App giới hạn ảnh 5 MB và file
    # import 10 MB. Body vượt 10 MB -> Nginx trả 413 ngay, KHÔNG chuyển vào app
    # (dòng log sẽ có urt=- và user "-"). Lưu ý: request multipart có thêm vài
    # trăm byte header/boundary, nên file đúng 10 MB có thể vẫn bị chặn ở đây.
    client_max_body_size 10m;

    # ---- Nhật ký --------------------------------------------------------------
    # Đường dẫn mặc định của Nginx. Trong image Docker chính thức, hai file này
    # là symlink tới /dev/stdout và /dev/stderr; docker-compose.yml mount thư
    # mục ./nginx/logs vào /var/log/nginx nên ta có file log thật trên máy host.
    # access_log ở mức server sẽ THAY THẾ (không cộng thêm) access_log "main"
    # được khai báo ở mức http trong nginx.conf.
    access_log /var/log/nginx/access.log qlsv;
    # Mức tối thiểu được ghi: debug | info | notice | warn | error | crit | alert | emerg
    error_log  /var/log/nginx/error.log warn;

    # ---- Header gửi sang app -------------------------------------------------
    # Các chỉ thị proxy_* đặt ở mức server được mọi location bên dưới kế thừa.
    proxy_http_version 1.1;
    # Tên miền client đã gõ (không kèm cổng; muốn giữ cả cổng thì dùng $http_host).
    proxy_set_header Host              $host;
    # IP thật của client (app nhìn thấy kết nối đến từ Nginx, không phải từ client).
    proxy_set_header X-Real-IP         $remote_addr;
    # Chuỗi IP qua các proxy: giá trị X-Forwarded-For cũ (nếu có) + $remote_addr.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # Giao thức client dùng (http/https).
    proxy_set_header X-Forwarded-Proto $scheme;

    # App gửi header X-User để Nginx ghi log ($upstream_http_x_user ở trên).
    # proxy_hide_header XÓA header này khỏi response trả cho trình duyệt, nhưng
    # biến $upstream_http_x_user vẫn đọc được để ghi log.
    proxy_hide_header X-User;

    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;   # export/import nhiều dòng có thể mất vài giây

    # ---- Giao diện (index.html, login.html, /css, /js, /uploads) ------------
    location / {
        proxy_pass http://qlsv_app;
    }

    # ---- favicon ----------------------------------------------------------------
    # Trình duyệt tự xin /favicon.ico khi mở trang. Nếu app không có file này
    # (app trả 404), Nginx đổi thành 204 No Content để thống kê lỗi 404 trong log
    # chỉ còn những đường dẫn thật sự đáng chú ý (máy quét, link hỏng...).
    # Nếu sau này app có favicon thật thì file vẫn được trả về bình thường.
    location = /favicon.ico {
        proxy_pass http://qlsv_app;
        proxy_intercept_errors on;      # cho phép error_page xử lý lỗi do app trả về
        error_page 404 = @no_content;
    }

    location @no_content {
        return 204;
    }

    # ---- REST API -------------------------------------------------------------
    # Lỗi do app sinh ra (400, 401, 403, 404, 409, 500...) được chuyển nguyên
    # vẹn cho client (proxy_intercept_errors mặc định là off). Chỉ những lỗi do
    # CHÍNH Nginx sinh ra mới được thay bằng JSON theo định dạng lỗi của API
    # ({ "error": { "code", "message" } }) để giao diện hiển thị được thông báo:
    #   502/503/504: không kết nối được app (app chưa chạy, đang khởi động lại...)
    #   413        : body vượt client_max_body_size
    location /api/ {
        proxy_pass http://qlsv_app;
        error_page 502 503 504 = @api_unavailable;
        error_page 413         = @api_too_large;
    }

    location @api_unavailable {
        default_type "application/json; charset=utf-8";
        return 502 '{"error":{"code":"BAD_GATEWAY","message":"Không kết nối được máy chủ ứng dụng. Vui lòng thử lại sau."}}';
    }

    location @api_too_large {
        default_type "application/json; charset=utf-8";
        return 413 '{"error":{"code":"FILE_ERROR","message":"File quá lớn (tối đa 10 MB)."}}';
    }
}
