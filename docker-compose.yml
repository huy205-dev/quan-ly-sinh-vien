# =============================================================================
#  docker-compose.yml: chạy Nginx làm reverse proxy cho app "Quản lý sinh viên"
# -----------------------------------------------------------------------------
#  App Node.js chạy TRỰC TIẾP trên máy host (không nằm trong Docker):
#      npm start                   # http://localhost:3000
#  Nginx chạy trong container, nhận request ở cổng 8080 của máy host rồi
#  chuyển tiếp (proxy) vào app:
#      mkdir -p nginx/logs         # (nên tạo trước, nhất là trên Linux)
#      docker compose up -d        # http://localhost:8080
#      tail -f nginx/logs/access.log
#      docker compose down
#  Chi tiết: docs/NGINX-LOG.md
# =============================================================================
services:
  nginx:
    image: nginx:1.30-alpine
    container_name: qlsv-nginx
    ports:
      # <cổng máy host>:<cổng trong container>
      - "8080:80"
    environment:
      # Giờ Việt Nam cho $time_local (mặc định container dùng UTC, log sẽ ghi +0000).
      # Nginx xóa mọi biến môi trường khi chạy worker, trừ TZ.
      TZ: Asia/Ho_Chi_Minh
    volumes:
      # Cấu hình reverse proxy + log_format qlsv (chỉ đọc).
      - ./nginx/qlsv.conf:/etc/nginx/conf.d/default.conf:ro
      # Trong image chính thức, /var/log/nginx/access.log và error.log là symlink
      # tới /dev/stdout và /dev/stderr (để dùng "docker logs"). Mount thư mục của
      # máy host đè lên /var/log/nginx sẽ che các symlink đó, nên Nginx ghi ra
      # FILE THẬT: nginx/logs/access.log và nginx/logs/error.log trên máy host.
      - ./nginx/logs:/var/log/nginx
    extra_hosts:
      # Docker Desktop/OrbStack (macOS, Windows) tự có host.docker.internal.
      # Trên Linux phải khai báo để tên này trỏ về máy host (gateway của Docker).
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
